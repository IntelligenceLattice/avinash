<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Faint architecture-diagram watermark: blocks for each layer of the stack, arrows for the interfaces. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc143c" fill-opacity="0.95"/>
    </marker>
  </defs>

  <!-- Blocks -->
  <g fill="#dc143c" fill-opacity="0.06" stroke="#dc143c" stroke-opacity="0.75" stroke-width="2">
    <rect x="200"  y="40"  width="300" height="80"  rx="14"/>
    <rect x="550"  y="40"  width="300" height="80"  rx="14"/>
    <rect x="900"  y="40"  width="300" height="80"  rx="14"/>

    <rect x="60"   y="210" width="300" height="110" rx="14"/>
    <rect x="450"  y="200" width="500" height="130" rx="16"/>
    <rect x="1040" y="210" width="300" height="110" rx="14"/>

    <rect x="450"  y="410" width="500" height="100" rx="14"/>

    <rect x="160"  y="590" width="480" height="120" rx="14"/>
    <rect x="760"  y="590" width="480" height="120" rx="14"/>

    <rect x="160"  y="800" width="480" height="130" rx="14"/>
    <rect x="760"  y="800" width="480" height="130" rx="14"/>
  </g>

  <!-- Interfaces -->
  <g fill="none" stroke="#dc143c" stroke-opacity="0.75" stroke-width="2" marker-end="url(#a)">
    <path d="M350 120 L560 200"/>
    <path d="M700 120 L700 200"/>
    <path d="M1050 120 L840 200"/>
    <path d="M360 265 L450 265" marker-start="url(#a)"/>
    <path d="M1040 265 L950 265" marker-start="url(#a)"/>
    <path d="M700 330 L700 410"/>
    <path d="M590 510 L450 590"/>
    <path d="M810 510 L950 590"/>
    <path d="M640 650 L760 650" marker-start="url(#a)"/>
    <path d="M400 710 L400 800"/>
    <path d="M1000 710 L1000 800"/>
    <path d="M760 710 L640 800"/>
  </g>

  <!-- Block titles -->
  <g fill="#7f1d1d" fill-opacity="0.95" font-size="24" font-weight="700" text-anchor="middle">
    <text x="350"  y="90">B2C apps</text>
    <text x="700"  y="90">B2B portals</text>
    <text x="1050" y="90">Operator OSS / BSS</text>

    <text x="210"  y="262">Model training</text>
    <text x="700"  y="258">Deterministic agentic AI</text>
    <text x="1190" y="262">Knowledge / RAG</text>

    <text x="700"  y="460">Domain orchestrator</text>

    <text x="400"  y="644">Management plane</text>
    <text x="1000" y="644">Control plane</text>

    <text x="400"  y="856">High-Performance Data Plane</text>
    <text x="1000" y="856">VoIP</text>
  </g>

  <!-- Block subtitles -->
  <g fill="#475569" fill-opacity="0.95" font-size="16" text-anchor="middle">
    <text x="210"  y="292">data · train · evaluate</text>
    <text x="700"  y="290">LangGraph agents · MCP tools · tracing</text>
    <text x="1190" y="292">vector store · re-ranking</text>
    <text x="700"  y="488">CloudCO · intent · service fulfilment</text>
    <text x="400"  y="676">YANG · inventory · topology</text>
    <text x="1000" y="676">SDN controller · VPN · overlay</text>
    <text x="400"  y="890">5G, DPI &amp; Media Engine</text>
    <text x="1000" y="890">RTP/RTCP, SIP, MGCP, IMS</text>
  </g>

  <!-- Interface labels -->
  <g fill="#dc143c" fill-opacity="0.95" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="712"  y="168">REST / API</text>
    <text x="368"  y="254">models</text>
    <text x="960"  y="254">retrieval</text>
    <text x="712"  y="378">MCP · intent</text>
    <text x="440"  y="548">NBI</text>
    <text x="900"  y="548">NBI</text>
    <text x="652"  y="640">topology</text>
    <text x="412"  y="762">NETCONF / YANG</text>
    <text x="1012" y="762">SBI</text>
    <text x="652"  y="756">SBI</text>
  </g>
</svg>
